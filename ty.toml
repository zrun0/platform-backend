# ty type checker configuration
# See: https://docs.astral.sh/ty/configuration/

[environment]
# Extra source paths for namespace packages in the monorepo.
# ty needs these to find all zrun.* modules across workspace members,
# since PEP 420 namespace packages are spread across multiple src/ dirs.
#
# Note: The virtual environment (.venv) is auto-discovered by ty when
# running from the project root. IDE/LSP integrations typically pass
# the project root automatically.
extra-paths = [
    "packages/auth/src",
    "packages/core/src",
    "packages/flow-api/src",
    "packages/uc-api/src",
    "apps/bff/src",
    "apps/flow/src",
    "apps/uc/src",
]
