[project]
name = "zrun-workspace"
version = "0.1.0"
description = "zrun FastAPI monorepo (workspace root)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false
# Centralized third-party version constraints; workspace members declare bare names.
constraint-dependencies = [
    "fastapi>=0.115",
    "pytest>=8.0",
    "httpx2>=2.12",
    "pydantic-settings>=2.0",
    "tenacity>=9.0",
    "uvicorn>=0.30",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in default args is the standard pattern

[tool.ruff.lint.isort]
known-first-party = ["zrun"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
asyncio_mode = "auto"  # Auto-detect async tests
addopts = [
    "--strict-markers",  # Strict marker checking
    "-v",                # Verbose output
    "--tb=short",        # Short traceback format
]
markers = [
    "integration: integration tests (slower, uses external services)",
    "unit: unit tests (fast, isolated)",
]
