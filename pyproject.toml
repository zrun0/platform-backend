[project]
name = "zrun-workspace"
version = "0.1.0"
description = "zrun FastAPI monorepo (workspace root)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.uv]
package = false
# Centralized third-party version constraints; workspace members declare bare names.
constraint-dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "tenacity>=9.0",
    "uvicorn>=0.30",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in default args is the standard pattern

[tool.ruff.lint.isort]
known-first-party = ["zrun"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
