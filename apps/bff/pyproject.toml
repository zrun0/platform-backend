[project]
name = "zrun-bff"
version = "0.1.0"
description = "Backend-for-Frontend service"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
    "zrun-auth",
    "zrun-core",
    "zrun-flow-api",
    "zrun-uc-api",
]

[dependency-groups]
dev = [
    "zrun-test-utils",
]

[tool.uv.sources]
zrun-auth = { workspace = true }
zrun-core = { workspace = true }
zrun-flow-api = { workspace = true }
zrun-uc-api = { workspace = true }
zrun-test-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zrun.bff"
