[project]
name = "lesoon-bff"
version = "0.1.0"
description = "Backend-for-Frontend service"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
    "lesoon-auth",
    "lesoon-core",
    "lesoon-flow-api",
    "lesoon-uc-api",
]

[dependency-groups]
dev = [
    "lesoon-test-utils",
]

[tool.uv.sources]
lesoon-auth = { workspace = true }
lesoon-core = { workspace = true }
lesoon-flow-api = { workspace = true }
lesoon-uc-api = { workspace = true }
lesoon-test-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lesoon.bff"
