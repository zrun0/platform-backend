[project]
name = "novon-bff"
version = "0.1.0"
description = "Backend-for-Frontend service"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
    "novon-auth",
    "novon-core",
    "novon-flow-api",
    "novon-uc-api",
]

[dependency-groups]
dev = [
    "novon-test-utils",
]

[tool.uv.sources]
novon-auth = { workspace = true }
novon-core = { workspace = true }
novon-flow-api = { workspace = true }
novon-uc-api = { workspace = true }
novon-test-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "novon.bff"
