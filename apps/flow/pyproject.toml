[project]
name = "lesoon-flow"
version = "0.1.0"
description = "Flow service"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
    "lesoon-auth",
    "lesoon-core",
    "lesoon-flow-api",
]

[tool.uv.sources]
lesoon-auth = { workspace = true }
lesoon-core = { workspace = true }
lesoon-flow-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lesoon.flow"
