[project]
name = "novon-uc-api"
version = "0.1.0"
description = "UC service API contract: models, protocol, and client"
requires-python = ">=3.14"
dependencies = [
    "novon-core",
]

[dependency-groups]
dev = [
    "novon-test-utils",
]

[tool.uv.sources]
novon-core = { workspace = true }
novon-test-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "novon.uc_api"
