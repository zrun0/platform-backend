[project]
name = "zrun-test-utils"
version = "0.1.0"
description = "Shared test utilities and fixtures for zrun platform"
requires-python = ">=3.14"
dependencies = [
    "httpx2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zrun_test_utils"
