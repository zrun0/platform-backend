[project]
name = "zrun-flow-api"
version = "0.1.0"
description = "Flow service API contract: models, protocol, and client"
requires-python = ">=3.14"
dependencies = [
    "zrun-core",
]

[tool.uv.sources]
zrun-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zrun.flow_api"
