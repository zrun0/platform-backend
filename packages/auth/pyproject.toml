[project]
name = "zrun-auth"
version = "0.1.0"
description = "Shared auth utilities: FastAPI dependencies"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "zrun-core",
]

[tool.uv.sources]
zrun-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zrun.auth"
