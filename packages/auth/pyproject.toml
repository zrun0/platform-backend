[project]
name = "lesoon-auth"
version = "0.1.0"
description = "Shared auth utilities: FastAPI dependencies"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "lesoon-core",
]

[tool.uv.sources]
lesoon-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lesoon.auth"
